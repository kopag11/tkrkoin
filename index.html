<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Tukar Koin Digital Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    :root { --primary: #4f46e5; }
    body { background: #f0f2f5; font-family: 'Poppins', sans-serif; min-height: 100dvh; display: flex; justify-content: center; }
    .app-card { background: white; width: 100%; max-width: 500px; min-height: 100dvh; display: flex; flex-direction: column; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
    .hidden { display: none !important; }
    .input-modern { border: 2px solid #e2e8f0; border-radius: 12px; padding: 12px 15px; width: 100%; background: #f8fafc; transition: 0.3s; }
    .input-modern:focus { border-color: var(--primary); outline: none; background: #fff; }
    .denom-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; background: #fff; padding: 10px; border-radius: 12px; border: 1px solid #f1f5f9; }
    .denom-badge { background: #3b82f6; color: white; padding: 8px 12px; border-radius: 8px; font-weight: bold; min-width: 80px; text-align: center; font-size: 13px; }
    canvas#signature-pad { border: 2px dashed #cbd5e1; border-radius: 15px; width: 100%; height: 180px; background: #fff; touch-action: none; }
    .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 500px; background: white; padding: 10px 0; display: flex; justify-content: space-around; border-top: 1px solid #eee; z-index: 1000; border-top-left-radius: 20px; border-top-right-radius: 20px; }
    .nav-item { border: none; background: none; color: #94a3b8; font-size: 11px; font-weight: 600; display: flex; flex-direction: column; align-items: center; }
    .nav-item.active { color: var(--primary); }
    .rincian-table { width: 100%; font-size: 14px; border-collapse: separate; border-spacing: 0 8px; }
    .rincian-table td { padding: 10px; background: #f8fafc; border-radius: 8px; }
    .rincian-table td:last-child { text-align: right; font-weight: bold; }
    .dash-section { background: #fff; padding: 25px; border-radius: 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid #f0f0f0; }
  </style>
</head>
<body>

  <div class="app-card">
    <div id="loginPage" class="p-4 flex-grow-1 d-flex flex-column justify-content-center">
      <div class="text-center mb-4">
        <i class="fas fa-truck-loading text-primary mb-3" style="font-size: 60px;"></i>
        <h2 class="fw-bold">Login Koin</h2>
      </div>
      <div class="mb-3"><input type="tel" id="loginNik" class="input-modern" placeholder="NIK Petugas"></div>
      <div class="mb-3"><input type="password" id="loginPass" class="input-modern" placeholder="Password"></div>
      <div class="mb-4">
        <label class="small fw-bold text-muted mb-1">Pilih Nomor Polisi (Data Maps):</label>
        <select id="loginNopol" class="input-modern form-select">
          <option value="">-- Memuat No Polisi... --</option>
        </select>
      </div>
      <button class="btn btn-primary w-100 py-3 rounded-4 fw-bold shadow" onclick="doLogin(this)">MASUK KE SISTEM</button>
    </div>

    <div id="mainApp" class="hidden flex-grow-1 d-flex flex-column">
      <div class="p-3 bg-white border-bottom shadow-sm">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <h6 class="m-0 fw-bold text-primary" id="badgeNama">-</h6>
            <span class="badge bg-secondary" id="badgeKendaraan">-</span>
          </div>
          <button class="btn btn-sm btn-outline-danger" onclick="logout()"><i class="fas fa-power-off"></i></button>
        </div>
      </div>

      <div id="formPage" class="p-4 overflow-auto flex-grow-1" style="padding-bottom: 100px;">
        <div class="input-group mb-4">
          <input type="text" class="input-modern" id="kodeToko" placeholder="Cari Kode Toko..." style="text-transform: uppercase;">
          <button class="btn btn-primary" onclick="cariToko(this)"><i class="fas fa-search"></i></button>
        </div>
        
        <div id="transactionArea" class="hidden">
          <input type="text" id="namaToko" class="input-modern mb-3" readonly placeholder="Nama Toko">
          
          <span class="d-block small fw-bold text-muted mb-2 ps-1">RINCIAN DENOM (TUKAR)</span>
          <div id="denomContainer" class="mb-4"></div>
          
          <div class="bg-warning bg-opacity-10 p-3 rounded-4 mb-3 border border-warning">
            <span class="d-block small fw-bold text-dark mb-2"><i class="fas fa-money-bill-wave me-1"></i> UANG TERIMA TOKO</span>
            <div class="denom-row">
              <div class="denom-badge bg-secondary">50.000</div>
              <input type="number" class="input-modern t-input" style="width:100px" data-v="50000" placeholder="Qty" oninput="hitungTerima()">
              <div class="denom-total small fw-bold">Rp <span class="subtotal-t">0</span></div>
            </div>
            <div class="denom-row">
              <div class="denom-badge bg-secondary">100.000</div>
              <input type="number" class="input-modern t-input" style="width:100px" data-v="100000" placeholder="Qty" oninput="hitungTerima()">
              <div class="denom-total small fw-bold">Rp <span class="subtotal-t">0</span></div>
            </div>
            <div class="text-end small fw-bold mt-2">Total Terima: Rp <span id="totalTerimaDisplay">0</span></div>
          </div>

          <div class="p-3 bg-primary text-white rounded-4 text-center mb-4 shadow">
            <small class="opacity-75">TOTAL TUKAR KOIN</small>
            <h2 class="m-0 fw-bold">Rp <span id="totalDisplay">0</span></h2>
          </div>

          <label class="d-block text-center small fw-bold text-muted mb-2">Tanda Tangan Tim Toko</label>
          <canvas id="signature-pad" class="mb-2"></canvas>
          <button class="btn btn-light btn-sm w-100 mb-4" onclick="signaturePad.clear()">Hapus TTD</button>

          <button class="btn btn-success w-100 py-3 rounded-4 fw-bold shadow-lg" id="btnSubmit" onclick="process(this)">PROSES & KIRIM STRUK</button>
        </div>
      </div>

      <div id="dashPage" class="p-4 hidden overflow-auto flex-grow-1" style="padding-bottom: 100px;">
        <h5 class="fw-bold mb-3 text-center">Dashboard Area <span id="dashNopol" class="text-primary"></span></h5>
        <div id="dashLoading" class="text-center py-5"><i class="fas fa-spinner fa-spin fa-2x text-muted"></i><br>Memuat data Dashboard...</div>
        <div id="dashContent" class="hidden">
            <div class="dash-section bg-primary text-white text-center">
                <small class="opacity-75">SISA UANG</small>
                <h2 class="fw-bold" id="dSisa">Rp 0</h2>
            </div>
            <div class="row g-2 mb-3 text-center">
                <div class="col-6"><div class="p-3 bg-white border rounded-4"><small class="text-muted">Modal</small><div class="fw-bold" id="dModal">0</div></div></div>
                <div class="col-6"><div class="p-3 bg-white border rounded-4"><small class="text-muted">Ditukar</small><div class="fw-bold text-success" id="dKeluar">0</div></div></div>
            </div>
            <div class="dash-section p-3 bg-white border rounded-4 mb-3">
                <div class="d-flex justify-content-between mb-2 small fw-bold"><span>PROGRESS TOKO</span><span id="dPersen">0%</span></div>
                <div class="progress" style="height: 10px;"><div class="progress-bar" id="dBar" style="width: 0%"></div></div>
                <div class="text-center mt-2 small">Total Toko: <b id="dToko">0</b></div>
            </div>
            <div class="p-3 bg-white border rounded-4">
                <small class="d-block mb-2 fw-bold text-muted">STOK DENOM</small>
                <table class="rincian-table" id="tableRincian"></table>
            </div>
        </div>
      </div>

      <div id="mapsPage" class="p-4 hidden overflow-auto flex-grow-1" style="padding-bottom: 100px;">
        <h5 class="fw-bold mb-3 text-center">Rute Kunjungan</h5>
        <div id="routeList" class="list-group list-group-flush"></div>
      </div>

      <div class="bottom-nav">
        <button class="nav-item active" id="navHome" onclick="switchPage('home')"><i class="fas fa-edit fs-5"></i><span>Input</span></button>
        <button class="nav-item" id="navDash" onclick="switchPage('dash')"><i class="fas fa-chart-line fs-5"></i><span>Dash</span></button>
        <button class="nav-item" id="navMaps" onclick="switchPage('maps')"><i class="fas fa-route fs-5"></i><span>Rute</span></button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbytFulvf5L89Xnz43OZNIOXR00j4Td6T6fyrp8F8NTCcrWIGNfUqlE-qIGFszzm7rjXxQ/exec"; 
    let signaturePad = null;
    const denoms = [100, 200, 500, 1000, 2000, 5000, 10000, 20000];

    window.onload = async () => {
      try {
        const res = await fetch(API_URL + "?action=getNopolList"); [cite: 3]
        const nopol = await res.json();
        const sel = document.getElementById('loginNopol');
        sel.innerHTML = '<option value="">-- Pilih Nomor Polisi --</option>';
        nopol.forEach(n => { sel.innerHTML += `<option value="${n}">${n}</option>`; });
      } catch (e) { console.error("Gagal muat Nopol"); }

      const sess = localStorage.getItem('session');
      if(sess) {
        const u = JSON.parse(sess);
        document.getElementById('loginPage').classList.add('hidden');
        document.getElementById('mainApp').classList.remove('hidden');
        document.getElementById('badgeNama').innerText = u.nama;
        document.getElementById('badgeKendaraan').innerText = u.nopol;
        initPad();
        renderDenoms();
      }
    };

    function initPad() {
      const canvas = document.getElementById('signature-pad');
      signaturePad = new SignaturePad(canvas, { 
        backgroundColor: 'rgb(255, 255, 255)', [cite: 21]
        minWidth: 2, maxWidth: 4 
      });
    }

    function renderDenoms() {
      const cont = document.getElementById('denomContainer');
      cont.innerHTML = "";
      denoms.forEach(d => {
        cont.innerHTML += `<div class="denom-row"><div class="denom-badge">${d.toLocaleString()}</div><input type="number" class="input-modern d-input" style="width:100px" data-v="${d}" placeholder="Qty" oninput="hitungTotal()"></div>`;
      });
    }

    function hitungTotal() {
      let total = 0;
      document.querySelectorAll('.d-input').forEach(el => {
        total += (parseInt(el.value) || 0) * parseInt(el.dataset.v);
      });
      document.getElementById('totalDisplay').innerText = total.toLocaleString('id-ID');
    }

    function hitungTerima() {
      let t = 0;
      document.querySelectorAll('.t-input').forEach(el => {
        let val = (parseInt(el.value) || 0) * parseInt(el.dataset.v);
        el.parentElement.querySelector('.subtotal-t').innerText = val.toLocaleString('id-ID');
        t += val;
      });
      document.getElementById('totalTerimaDisplay').innerText = t.toLocaleString('id-ID');
    }

    async function cariToko(btn) {
      const kode = document.getElementById('kodeToko').value.toUpperCase();
      if(!kode) return;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
      try {
        const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'search', kode: kode })});
        const data = await res.json();
        if(data.found) {
          document.getElementById('namaToko').value = data.nama;
          document.getElementById('transactionArea').classList.remove('hidden');
        } else { Swal.fire('Toko tidak ditemukan', '', 'warning'); }
      } catch (e) { Swal.fire('Error', 'Gagal koneksi', 'error'); }
      btn.innerHTML = '<i class="fas fa-search"></i>';
    }

    async function doLogin(btn) {
      const nopol = document.getElementById('loginNopol').value;
      if(!nopol) return Swal.fire('Pilih Nomor Polisi!', '', 'warning');
      btn.disabled = true;
      const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'login', nik: document.getElementById('loginNik').value, pass: document.getElementById('loginPass').value })});
      const data = await res.json();
      if(data.status === 'success') {
        data.nopol = nopol;
        localStorage.setItem('session', JSON.stringify(data));
        location.reload();
      } else { Swal.fire('Login Gagal', 'NIK atau Password salah', 'error'); btn.disabled = false; }
    }

    async function process(btn) {
      if(signaturePad.isEmpty()) return Swal.fire('Tanda tangan wajib!', '', 'warning');
      const user = JSON.parse(localStorage.getItem('session'));
      btn.innerHTML = 'Memproses...'; btn.disabled = true;

      setTimeout(async () => {
        try {
          const { jsPDF } = window.jspdf;
          const doc = new jsPDF({ format: [105, 240], compress: true }); [cite: 12]
          doc.setFontSize(14); doc.text("STRUK PENUKARAN KOIN", 52.5, 15, {align: 'center'});
          doc.setFontSize(10);
          doc.text("NOPOL: " + user.nopol, 10, 25);
          doc.text("TOKO : " + document.getElementById('kodeToko').value, 10, 30);
          doc.text("TOTAL: Rp " + document.getElementById('totalDisplay').innerText, 10, 40);
          
          const sigImg = signaturePad.toDataURL('image/jpeg', 0.15); [cite: 21]
          doc.addImage(sigImg, 'JPEG', 60, 180, 35, 20);

          const payload = {
            action: 'save',
            data: {
                nopol: user.nopol,
                petugas: user.nama,
                kodeToko: document.getElementById('kodeToko').value,
                totalUang: document.getElementById('totalDisplay').innerText.replace(/\./g,''),
                isTukar: true
            },
            image: doc.output('datauristring'), [cite: 5]
            filename: "struk-" + document.getElementById('kodeToko').value + ".pdf"
          };

          const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload)});
          const out = await res.json();
          if(out.status === 'success') {
            Swal.fire('Berhasil!', 'Data tersimpan. Membuka WhatsApp...', 'success').then(() => {
              window.location.href = `https://wa.me/?text=Bukti Tukar Koin: ${out.fileUrl}`;
              setTimeout(() => location.reload(), 2000); [cite: 21]
            });
          }
        } catch (e) { Swal.fire('Error', 'Gagal kirim data', 'error'); btn.disabled = false; btn.innerHTML = 'ULANGI'; }
      }, 100);
    }

    async function switchPage(p) {
      const user = JSON.parse(localStorage.getItem('session'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      document.getElementById('formPage').classList.add('hidden');
      document.getElementById('dashPage').classList.add('hidden');
      document.getElementById('mapsPage').classList.add('hidden');

      if(p === 'home') {
        document.getElementById('formPage').classList.remove('hidden');
        document.getElementById('navHome').classList.add('active');
      } else if(p === 'dash') {
        document.getElementById('dashPage').classList.remove('hidden');
        document.getElementById('navDash').classList.add('active');
        document.getElementById('dashNopol').innerText = user.nopol;
        loadDashboard(user.nopol);
      } else if(p === 'maps') {
        document.getElementById('mapsPage').classList.remove('hidden');
        document.getElementById('navMaps').classList.add('active');
        loadRoute(user.nopol);
      }
    }

    async function loadDashboard(nopol) {
      document.getElementById('dashLoading').classList.remove('hidden');
      document.getElementById('dashContent').classList.add('hidden');
      try {
        const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'getDashboard', nopol: nopol })}); [cite: 6]
        const json = await res.json();
        if(json.status === 'success') {
          document.getElementById('dModal').innerText = json.uangDibawa;
          document.getElementById('dKeluar').innerText = json.uangDitukar;
          document.getElementById('dSisa').innerText = json.sisaUang;
          document.getElementById('dToko').innerText = json.jmlToko;
          document.getElementById('dPersen').innerText = json.persen;
          document.getElementById('dBar').style.width = json.persen;
          
          let html = "";
          const labels = ["100", "200", "500", "1.000", "2.000", "5.000", "10.000", "20.000"];
          json.rincian.forEach((val, i) => { html += `<tr><td>${labels[i]}</td><td>${val}</td></tr>`; });
          document.getElementById('tableRincian').innerHTML = html;
          
          document.getElementById('dashLoading').classList.add('hidden');
          document.getElementById('dashContent').classList.remove('hidden');
        }
      } catch (e) { console.error("Error Dashboard"); }
    }

    async function loadRoute(nopol) {
      const cont = document.getElementById('routeList');
      cont.innerHTML = "Memuat Rute...";
      try {
        const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'getMaps', nopol: nopol })}); [cite: 8]
        const json = await res.json();
        cont.innerHTML = "";
        json.stores.forEach((tk, i) => {
          cont.innerHTML += `<div class="list-group-item"><b>${i+1}.</b> ${tk.kode} - ${tk.nama}</div>`;
        });
      } catch (e) { cont.innerHTML = "Gagal memuat rute"; }
    }

    function logout() { localStorage.clear(); location.reload(); }
  </script>
</body>
</html>
