<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mengalihkan ke Server Baru...</title>
    
    <meta http-equiv="refresh" content="0; url=https://tukar-koin-idm.vercel.app/mobile.html" />
    
    <script>
        window.location.replace("https://tukar-koin-idm.vercel.app/mobile.html");
    </script>
    
    <style>
        body {
            font-family: "Open Sans", system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f5;
            color: #3f3f46;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .spinner {
            border: 4px solid #e4e4e7;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 { margin-bottom: 10px; color: #1e293b; }
        p { color: #71717a; margin-bottom: 20px; }
        a {
            display: inline-block;
            background-color: #3b82f6;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.2s;
        }
        a:hover { background-color: #2563eb; }
    </style>
</head>
<body>

    <div class="spinner"></div>
    <h2>Aplikasi Telah Diperbarui & Berpindah Alamat</h2>
    <p>Sistem sedang mengalihkan Anda ke server baru secara otomatis...</p>
    
    <a href="https://tukar-koin-idm.vercel.app/mobile.html">Klik Di Sini Jika Tidak Dialihkan</a>

</body>
</html>
